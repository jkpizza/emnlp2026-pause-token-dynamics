model: Qwen/Qwen3-1.7B-Base
dataset:
  repo_id: saramal/Qwen3-4B-rollout
  revision: 04ab3708f9af02a18aa06a568607ae0bb2afff04
  pause_token_id: 56940
  tokenizer_single_word: true
  tokenizer_special: false
training:
  pretrain: Qwen/Qwen3-1.7B-Base
  max_epochs: 3
  learning_rate: 5e-06
  train_batch_size: 32
  max_len: 2048
  lora_rank: 0
  lora_alpha: 16
  lora_dropout: 0.05
  lr_scheduler: cosine_with_min_lr
  lr_warmup_ratio: 0.03
  pause_init_method: mean
  prompt_type: qwen2-boxed-cot
  seed: 42
  eval_steps: 1000
  logging_steps: 20
  adam_betas:
  - 0.9
  - 0.95
  l2: 0
  max_norm: 1
  zero_stage: 2
  bf16: true
  gradient_checkpointing: true
  target_modules: all-linear
  attn_implementation: flash_attention_2
  max_ckpt_num: 3
  max_ckpt_mem: 1e+08
  full_determinism: false
  gradient_checkpointing_use_reentrant: false
  lora_embedding_train_mode: embedding_lora
variants:
  none:
    training:
      micro_train_batch_size: 4
      save_steps: 1000
      predict_pause_tokens: false
      packing_samples: true
    holdout_eval: true
  step:
    training:
      micro_train_batch_size: 2
      save_steps: 1000
      predict_pause_tokens: false
      packing_samples: false
    holdout_eval: true
  step_unmasked:
    training:
      micro_train_batch_size: 4
      save_steps: 0
      predict_pause_tokens: true
      packing_samples: false
    holdout_eval: true
  append:
    training:
      micro_train_batch_size: 2
      save_steps: 1000
      predict_pause_tokens: false
      packing_samples: false
    holdout_eval: true
  random:
    training:
      micro_train_batch_size: 2
      save_steps: 1000
      predict_pause_tokens: false
      packing_samples: false
    holdout_eval: true
  dit:
    training:
      micro_train_batch_size: 2
      save_steps: 1000
      predict_pause_tokens: false
      packing_samples: false
    holdout_eval: true
