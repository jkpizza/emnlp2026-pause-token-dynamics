settings:
  actor_learning_rate: 5.0e-07
  actor_num_gpus_per_node: 4
  actor_num_nodes: 1
  adam_betas:
  - 0.9
  - 0.95
  adam_offload: false
  advantage_estimator: dr_grpo
  answer_trigger: 'The answer is:'
  attn_implementation: flash_attention_2
  aux_loss_coef: 0.0
  bf16: true
  colocate_all_models: true
  deepspeed_enable_sleep: true
  disable_ds_ckpt: true
  dynamic_filtering_reward_range:
  - 0
  - 1
  ema_beta: 0.992
  enforce_eager: true
  eps_clip: 0.2
  eval_dataset: skrishna/gsm8k_only_answer
  eval_dataset_name: gsm8k
  eval_dataset2: evaluation/eval_data/math_500_test.jsonl
  eval_dataset2_name: math_500
  eval_input_key: text
  eval_input_key2: question
  eval_label_key: label
  eval_label_key2: answer
  eval_n_samples_per_prompt: 4
  eval_pass_at_k: 4
  eval_split: test
  eval_split2: train
  eval_steps: 5
  eval_temperature: 0.6
  gamma: 1.0
  generate_max_len: 2048
  gradient_checkpointing: true
  grpo_mode: pause
  init_kl_coef: 0.001
  input_key: text
  kl_estimator: k3
  l2: 0.0
  label_key: label
  logging_steps: 1
  lora_rank: 0
  lr_scheduler: cosine_with_min_lr
  lr_warmup_ratio: 0.03
  max_epochs: 3
  max_norm: 1.0
  micro_rollout_batch_size: 4
  micro_train_batch_size: 4
  n_samples_per_prompt: 8
  normalize_reward: true
  num_episodes: 1
  packing_samples: true
  pause_clip_penalty: 0.05
  pause_init_method: mean
  pause_length_target: 800
  pause_over_target_token_penalty: 0.0001
  pause_penalty_correct_only: true
  pause_penalty_ramp_steps: 40
  pause_penalty_warmup_steps: 20
  pause_posthoc_rollout_end_ratio: 0.5
  pause_posthoc_rollout_ratio_schedule: true
  pause_posthoc_rollout_ratio_warmup_end_step: 40
  pause_posthoc_rollout_ratio_warmup_start_step: 0
  pause_posthoc_rollout_start_ratio: 0.8
  pause_prefix_decode_block_size: 128
  pause_reference_mode: original
  pause_token: <|PAUSE|>
  pause_tokens_per_step: 1
  policy_loss_type: ppo
  pretrain: Qwen/Qwen3-1.7B-Base
  prompt_data: saramal/SimpleRL-Zoo-Data-random-5K
  prompt_max_len: 1024
  prompt_split: train
  prompt_type: qwen2-boxed-cot
  ref_num_gpus_per_node: 4
  ref_num_nodes: 1
  rollout_batch_size: 64
  save_hf_ckpt: true
  save_steps: 10
  seed: 42
  temperature: 1.0
  top_p: 1.0
  train_batch_size: 128
  use_kl_loss: true
  use_lora_disabled_ref_model: false
  vllm_enable_sleep: true
  vllm_generate_batch_size: 64
  vllm_gpu_memory_utilization: 0.6
  vllm_is_truncated_threshold: 2.0
  vllm_num_engines: 4
  vllm_sync_backend: nccl
  vllm_tensor_parallel_size: 1
  zero_stage: 2
